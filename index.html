  .ytwrap{position:relative;width:min(760px,92vw);aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
  .ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ytmask{position:absolute;top:0;left:0;right:0;height:72px;z-index:2;pointer-events:none;

  .conn{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;background:#2a1620;border:1px solid var(--blood);

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}

  .bat{position:fixed;z-index:0;pointer-events:none;color:#120e16;opacity:.5;animation:drift linear infinite}
  @keyframes drift{0%{transform:translate(-8vw,8vh)}50%{transform:translate(55vw,-6vh)}100%{transform:translate(112vw,10vh)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .setup code{background:#1b1822;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:.85em}
</style>

  if(!initFirebase()){ app.innerHTML=msg('Setup needed','Firebase didn’t initialize — double-check the config block at the top of index.html.'); return; }
  // resume?
  try{
    const h=localStorage.getItem('mm_host');
    const p=JSON.parse(localStorage.getItem('mm_player')||'null');
    if(h){ roomCode=h; role='host'; try{answerKey=JSON.parse(localStorage.getItem('mm_key')||'{}')}catch(e){} attach(); return; }
    if(p&&p.code&&p.pid){ roomCode=p.code; me={pid:p.pid,name:p.name}; role='player'; attach(); return; }
  }catch(e){}
  renderLanding();
});

function attach(){
  if(roomRef) roomRef.off();
  roomRef=db.ref('rooms/'+roomCode);
  roomRef.on('value',snap=>{ data=snap.val(); if(data===null && role){ /* room gone */ } render(); },
    err=>{ document.getElementById('conn').style.display='block'; });
  db.ref('.info/connected').on('value',s=>{ document.getElementById('conn').style.display=s.val()?'none':'block'; });
}

/* ===================== HOST ===================== */
function hostCreate(){
  roomCode=rid(4); role='host'; answerKey={};
  localStorage.setItem('mm_host',roomCode); localStorage.setItem('mm_key','{}');
  db.ref('rooms/'+roomCode).set({createdAt:Date.now(),phase:'lobby',qIndex:-1,qSeconds:20});
  attach();
}
function hostStart(){ db.ref('rooms/'+roomCode).update({scoresReset:Date.now()}); resetScores().then(()=>hostNext(-1)); }
function resetScores(){
  return db.ref('rooms/'+roomCode+'/players').once('value').then(s=>{
    const u={}; s.forEach(c=>{u[c.key+'/score']=0;}); return s.numChildren()?db.ref('rooms/'+roomCode+'/players').update(u):null;
  });
}
function hostNext(force){
  if(hostTO){clearTimeout(hostTO);hostTO=null;}
  const qi=(typeof force==='number')?force+1:(data.qIndex+1);
  if(qi>=QUESTIONS.length){ return hostFinal(); }
  const q=QUESTIONS[qi];
  const order=[0,1,2,3].sort(()=>Math.random()-0.5);
  const options=order.map(k=>q.options[k]);
  const correctIndex=order.indexOf(q.correct);
  answerKey[qi]=correctIndex; localStorage.setItem('mm_key',JSON.stringify(answerKey));
  const qSeconds=(data&&data.qSeconds)||20;
  db.ref('rooms/'+roomCode).update({
    phase:'question', qIndex:qi,
    current:{cat:q.cat,art:q.art||null,prompt:q.prompt,options,dbl:!!q.dbl,link:q.link||null,linkLabel:q.linkLabel||null,yt:q.yt||null,start:q.start||null,end:q.end||null,img:q.img||null,deadline:Date.now()+qSeconds*1000,correct:null,stats:null}
  });
  sfxOrgan();
  hostTO=setTimeout(hostReveal,qSeconds*1000+300);
}
function hostReveal(){
  if(hostTO){clearTimeout(hostTO);hostTO=null;}
  if(!data||data.phase!=='question') return;
  const qi=data.qIndex, cur=data.current, ci=answerKey[qi];
  db.ref('rooms/'+roomCode+'/answers/'+qi).once('value').then(s=>{
    const ans=s.val()||{}, dur=((data.qSeconds)||20)*1000, su={}; let answered=0,correct=0;
    db.ref('rooms/'+roomCode+'/players').once('value').then(ps=>{
      const scores={}; ps.forEach(c=>scores[c.key]=(c.val().score||0));
      Object.keys(ans).forEach(pid=>{
        const a=ans[pid]; if(!a||typeof a.choice!=='number')return; answered++;
        if(a.choice===ci){ correct++;
          const frac=clamp((cur.deadline-(a.at||cur.deadline))/dur,0,1);
          const pts=Math.round(BASE*(0.5+0.5*frac))*(cur.dbl?2:1);
          scores[pid]=(scores[pid]||0)+pts; su[pid+'/score']=scores[pid];
        }
      });
      const upd={phase:'reveal','current/correct':ci,'current/stats':{answered,correct,total:Object.keys(data.players||{}).length}};
      db.ref('rooms/'+roomCode).update(upd);
      if(Object.keys(su).length) db.ref('rooms/'+roomCode+'/players').update(su);
      sfxGong();
    });
  });
}
function hostFinal(){ db.ref('rooms/'+roomCode).update({phase:'final'}); }
function hostSetTime(s){ db.ref('rooms/'+roomCode).update({qSeconds:s}); }
function hostEnd(){ if(confirm('Close this room for everyone and wipe it? This can’t be undone.')){ db.ref('rooms/'+roomCode).remove(); localStorage.removeItem('mm_host'); localStorage.removeItem('mm_key'); location.reload(); } }
function hostPause(){ if(!data||data.phase!=='question'||!data.current||data.current.paused)return; if(hostTO){clearTimeout(hostTO);hostTO=null;} const left=Math.max(0,(data.current.deadline||Date.now())-Date.now()); db.ref('rooms/'+roomCode+'/current').update({paused:true,pausedLeft:left}); }
function hostResume(){ if(!data||!data.current||!data.current.paused)return; const left=data.current.pausedLeft||0; if(hostTO){clearTimeout(hostTO);hostTO=null;} db.ref('rooms/'+roomCode+'/current').update({paused:false,pausedLeft:null,deadline:Date.now()+left}); hostTO=setTimeout(hostReveal,left+300); }
function hostEndGame(){ if(confirm('End the game now and jump to the final standings? Scores are kept.')){ if(hostTO){clearTimeout(hostTO);hostTO=null;} hostFinal(); } }
function hostClear(){ if(confirm('Clear all scores and send everyone back to the lobby? Players stay in the room.')){ if(hostTO){clearTimeout(hostTO);hostTO=null;} resetScores().then(()=>db.ref('rooms/'+roomCode).update({phase:'lobby',qIndex:-1,current:null})); } }

/* ===================== PLAYER ===================== */
function playerJoin(code,name){
  code=String(code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  name=String(name||'').trim().slice(0,24)||('Guest '+rid(3));
  if(code.length<4){ flash('Enter the 4-character room code'); return; }
  db.ref('rooms/'+code).once('value').then(s=>{
    if(!s.exists()){ flash('No game found with that code'); return; }
    const pid=rid(9); me={pid,name}; roomCode=code; role='player';
    localStorage.setItem('mm_player',JSON.stringify({code,pid,name}));
    db.ref('rooms/'+code+'/players/'+pid).set({name,score:0,joinedAt:Date.now()}).then(attach);
  });
}
function playerAnswer(i){
  if(!data||data.phase!=='question')return;
  if(data.current&&data.current.paused)return;
  const qi=data.qIndex;
  if(myAnswer(qi)!=null)return;
  db.ref('rooms/'+roomCode+'/answers/'+qi+'/'+me.pid).set({choice:i,at:Date.now()});
}
function myAnswer(qi){ return data&&data.answers&&data.answers[qi]&&data.answers[qi][me.pid]?data.answers[qi][me.pid].choice:null; }
function playerLeave(){ localStorage.removeItem('mm_player'); location.reload(); }

  o.innerHTML='<div class="clipmodal"><button class="clipclose" id="clipClose" aria-label="Close">✕</button>'+
    '<div class="ytwrap"><iframe src="'+ytEmbed(c)+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe><div class="ytmask"><b>🎵 Name that tune</b></div></div>'+
    '<div class="cliplink"><a href="'+esc(c.link||('https://www.youtube.com/watch?v='+c.yt))+'" target="_blank" rel="noopener">Not playing? Open on YouTube ↗</a></div></div>';
  const cc=document.getElementById('clipClose'); if(cc)cc.addEventListener('click',closeClip); }
function closeClip(){ const o=document.getElementById('clipOverlay'); if(o)o.innerHTML=''; }
function byId(i,fn){const e=document.getElementById(i);if(e)e.addEventListener('click',fn);}
function val(i){const e=document.getElementById(i);return e?e.value:'';}

/* ===================== SOUND ===================== */
let actx; function ac(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tones(seq){const a=ac();if(!a)return;let t=a.currentTime+.01;seq.forEach(s=>{const o=a.createOscillator(),g=a.createGain();o.type=s.type||'sine';o.frequency.setValueAtTime(s.f,t);if(s.f2)o.frequency.exponentialRampToValueAtTime(s.f2,t+s.d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(s.v||.08,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+s.d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+s.d+.03);t+=(s.gap!=null?s.gap:s.d);});}
function chord(fs,d,v){const a=ac();if(!a)return;const t=a.currentTime+.01;fs.forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.045,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);});}
function sfxCorrect(){tones([{f:523,d:.12,gap:.1,type:'triangle'},{f:659,d:.12,gap:.1,type:'triangle'},{f:784,d:.26,type:'triangle',v:.1}]);}
function sfxWrong(){tones([{f:196,d:.2,gap:.17,type:'sawtooth',v:.08},{f:146,f2:110,d:.34,type:'sawtooth',v:.08}]);}
function sfxOrgan(){chord([146.83,174.61,220],.9,.045);}
function sfxGong(){tones([{f:110,f2:70,d:.8,type:'sine',v:.12}]);}

/* procedural spooky ambience — original, synthesized, loops forever */
let ambient=null, musicOn=false;
function startAmbient(){
  const a=ac(); if(!a||ambient)return;
  const master=a.createGain(); master.gain.value=0.05; master.connect(a.destination);
  const filt=a.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=360; filt.Q.value=5; filt.connect(master);
  const o1=a.createOscillator(); o1.type='sawtooth'; o1.frequency.value=55;      // low drone
  const o2=a.createOscillator(); o2.type='sawtooth'; o2.frequency.value=58.27;    // detuned, unsettled
  const dg=a.createGain(); dg.gain.value=0.5; o1.connect(dg); o2.connect(dg); dg.connect(filt);
  const lfo=a.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.07;      // slow filter sweep
  const lfog=a.createGain(); lfog.gain.value=170; lfo.connect(lfog); lfog.connect(filt.frequency);
  o1.start(); o2.start(); lfo.start();
  const notes=[523.25,587.33,392,466.16];
  const amb={master,o1,o2,lfo,timer:null};
  const chime=()=>{ if(ambient!==amb)return;
    if(Math.random()<0.6){ const o=a.createOscillator(),g=a.createGain(); o.type='sine';
      o.frequency.value=notes[Math.floor(Math.random()*notes.length)]*(Math.random()<.5?1:2);
      g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(0.025,a.currentTime+0.4);
      g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+2.4); o.connect(g); g.connect(master); o.start(); o.stop(a.currentTime+2.5); }
    amb.timer=setTimeout(chime, 3000+Math.random()*4500); };
  ambient=amb; chime();
}
function stopAmbient(){ if(!ambient)return; const a=ambient; ambient=null; try{ a.o1.stop(); a.o2.stop(); a.lfo.stop(); clearTimeout(a.timer); a.master.disconnect(); }catch(e){} }
function toggleMusic(){ musicOn=!musicOn; if(musicOn)startAmbient(); else stopAmbient(); updateMusicBtn(); }
function updateMusicBtn(){ const b=document.getElementById('musicToggle'); if(!b)return; b.textContent=musicOn?'🔊':'🔇'; b.title=musicOn?'Background music on':'Background music off'; b.style.display=(role==='host')?'flex':'none'; }

/* ===================== DECOR ===================== */
function bats(){ if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const s='<svg width="30" height="16" viewBox="0 0 30 16" fill="currentColor"><path d="M15 3c1-2 3-3 4-1 1-3 4-2 5 0 2-1 4 0 4 2-2 0-3 1-4 3-1-2-2-2-3-1 0-1-1-1-2 0-1-1-2-1-2 1-1-2-2-2-3 0-1-3-3-3-4 0 0-2-2-2-4 1 2-2 4-2 5 0 1-2 3-1 4 1Z"/></svg>';
  for(let i=0;i<3;i++){const b=document.createElement('div');b.className='bat';b.setAttribute('aria-hidden','true');b.style.top=(Math.random()*70)+'vh';b.style.animationDuration=(18+Math.random()*16)+'s';b.style.animationDelay=(-Math.random()*20)+'s';b.innerHTML=s;document.body.appendChild(b);}
}
function confetti(){ if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const box=document.createElement('div');box.className='confetti';box.setAttribute('aria-hidden','true');
  const bits=['🎃','★','🦇','🍬','👻'];
  for(let i=0;i<30;i++){const s=document.createElement('span');s.textContent=bits[i%bits.length];s.style.left=(Math.random()*100)+'vw';s.style.fontSize=(.9+Math.random()*1.3)+'rem';s.style.animationDuration=(2.6+Math.random()*2.2)+'s';s.style.animationDelay=(Math.random()*.7)+'s';box.appendChild(s);}
  document.getElementById('confettiHost').appendChild(box);setTimeout(()=>box.remove(),5600);
}
